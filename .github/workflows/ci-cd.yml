name : LLM application CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs: 
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

        # install and run ollama on git actions ubuntu
      - name: Install and start Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve &
          sleep 5
          ollama pull qwen3:latest

      - name: Run unit tests
        run: pytest tests/test_unit.py

      - name: Run integration tests
        run: pytest tests/test_integration.py

    # Run LLM Evals in CI

      - name: Run LLM evaluations
        env:
            PYTHONPATH: .
        run: python evals/run_evals.py

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker image
        run: |
          IMAGE_NAME="ghcr.io/${{ github.repository }}:latest"
          IMAGE_TAG="ghcr.io/${{ github.repository }}:${{ github.sha }}"
          
          # Convert to lowercase in case repo name has capital letters
          IMAGE_NAME=$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')
          IMAGE_TAG=$(echo "$IMAGE_TAG" | tr '[:upper:]' '[:lower:]')

          docker build -t "$IMAGE_NAME" -t "$IMAGE_TAG" .
          docker push "$IMAGE_NAME"
          docker push "$IMAGE_TAG"
